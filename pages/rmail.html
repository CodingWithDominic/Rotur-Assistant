<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <script src="../initialize.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
        <title>Rmail - Rotur Assistant</title>
    </head>
    <body>
        <header id="header-placeholder"></header>
        <script src="../header.js"></script>
        <div class="container" id="container_exemption">
            <div id="rmailpage1">
                <h1 style="padding-right: 32px;">Rmail</h1>
                <button id="viewbanreasonbtn" style="display: none;">Ban Reason</button>
                <div id="rmailheaderactionbar">
                    <button id="reloadrmails" title="Refresh Rmails">⟳</button>
                    <button id="encryptionsettings" title="Manage Encryption Settings"><img src="../images/misc_icons/rmailsecurity.png" width="32" height="32"></button>
                    <button id="compose_rmail">+ Compose</button>
                </div>
                <hr class="full-size">
                <div id="rmailheader">
                    <button class="rmailnavbtn" id="rmailnavleft" style="display: none;">&larr;</button>
                    <button class="rmailtab" id="rmail_sent" style="border-bottom: 2px solid white;">Sent</button>
                    <button class="rmailtab" id="rmail_received">Received</button>
                    <button class="rmailtab" id="rmail_starred">Starred</button>
                    <button class="rmailtab" id="rmail_other" style="display: none;">Other</button>
                    <button class="rmailtab" id="rmail_drafts" style="display: none;">Drafts</button>
                    <button class="rmailtab" id="rmail_cached" style="display: none;">Cached</button>
                    <button class="rmailtab" id="rmail_archive" style="display: none;">Archive</button>
                    <button class="rmailtab" id="rmail_trash" style="display: none;">Trash</button>
                    <button class="rmailnavbtn" id="rmailnavright">&rarr;</button>
                </div>
                <div id="rmailsenttab" class="rmailfeed" style="display: block;">
                    <ul id="sentrmailslist">
                        <h2>Loading...</h2>
                    </ul>
                </div>
                <div id="rmailreceivedtab" class="rmailfeed" style="display: none;">
                    <ul id="receivedrmailslist">
                        <h2>Loading...</h2>
                    </ul>
                </div>
                <div id="rmailstarredtab" class="rmailfeed" style="display: none;">
                    <ul id="rmailstarredlist">
                        <h2>Loading...</h2>
                    </ul>
                </div>
                <div id="rmailothertab" class="rmailfeed" style="display: none;">
                    <ul id="rmailotherlist">
                        <h2>Loading...</h2>
                    </ul>
                </div>
                <div id="rmaildraftstab" class="rmailfeed" style="display: none;">
                    <ul id="rmaildraftslist">
                        <h2>Loading...</h2>
                    </ul>
                </div>
                <div id="rmailcachetab" class="rmailfeed" style="display: none;">
                    <ul id="rmailcachelist">
                        <h2>Loading...</h2>
                    </ul>
                </div>
                <div id="rmailarchivetab" class="rmailfeed" style="display: none;">
                    <ul id="rmailarchivelist">
                        <h2>Loading...</h2>
                    </ul>
                </div>
                <div id="rmailtrashtab" class="rmailfeed" style="display: none;">
                    <ul id="rmailtrashlist">
                        <h2>Loading...</h2>
                    </ul>
                </div>
            </div>

            <div id="rmailpage2" style="display: none;">
                <div id="rmailcontainerheader">
                    <button id="rmail_goback">&larr; Back</button>
                    <div id="rmailactionbarbuttons">

                    </div>
                </div>
                <hr class="full-size">
                <div id="original_rmail"></div>
                <section id="rmailreplyelements">
                    <hr class="full-size" style="border: 2px solid white;">
                    <ul id="rmailreplies">
                        <h3>Loading Replies...</h3>
                    </ul>
                    <section id="rmail_replybox">
                        <hr class="full-size" id="rmailreplyhr">
                        <h2>Add a reply</h2>
                        <form id="rmailreplycompositionbox">
                            <label class="compositiontitle">
                                To: 
                                <input type="text" placeholder="Original Sender" id="rmail_reply_receipient" maxlength="100">
                            </label>
                            <label class="compositiontitle">
                                Title: 
                                <input type="text" placeholder="Re: (Original subject)" id="rmail_reply_title" maxlength="100">
                            </label>
                            <label for="rmail_reply_comp_body">Body:</label>
                            <textarea id="rmail_reply_comp_body" placeholder="Reply content"></textarea>
                            <div id="reply_imagebar">
                                <label class="rmailreplyattachment">
                                    Attachment(s): 
                                    <input type="file" id="rmailreplyimage" title="Shift-click to paste attachment instead" accept="*" multiple>
                                </label>
                                <button id="clearreplyattachment" title="Clear Attachments" type="button">✕</button>
                            </div>
                            <label class="labelandinput">
                                <input type="checkbox" id="replyencrypted">
                                Encrypted
                            </label>
                            <button id="send_rmail_reply">Send &rarr;</button>
                        </form>
                    </section>
                </section>
            </div>

            <div id="rmailpage3" style="display: none;">
                <h1>Compose Rmail</h1>
                <button id="rmail_goback2">&larr; Back</button>
                <hr class="full-size">
                <form id="rmailcompositionbox">
                    <label class="compositiontitle">
                        To: 
                        <input type="text" placeholder="Recipient" id="rmail_comp_receipient" maxlength="100">
                    </label>
                    <label class="compositiontitle">
                        Title: 
                        <input type="text" placeholder="Title" id="rmail_comp_title" maxlength="100">
                    </label>
                    <label for="rmail_comp_body" class="rmailcompbodylabel">Body: </label>
                    <textarea id="rmail_comp_body" placeholder="Content"></textarea>
                    <div id="imagebar">
                        <label class="rmailattachment">
                            Attachment(s): 
                            <input type="file" id="rmailimage" title="Shift-click to paste attachment instead" accept="*" multiple>
                        </label>
                        <button id="clearattachment" title="Clear Attachments" type="button">✕</button>
                    </div>
                    <label class="labelandinput">
                        <input type="checkbox" id="burnafterreadoption">
                        Burn After Read
                    </label>
                    <label class="labelandinput">
                        <input type="checkbox" id="encrypted">
                        Encrypted
                    </label>
                    <div id="sendrmailactionbar">
                        <button id="rmailsavedraft">Save Draft</button>
                        <button id="send_rmail">Send &rarr;</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="overlay" id="overlay">
            <div class="popup"></div>
        </div>
        <script type="module" src="../scripts/rmail.js"></script>
        <footer id="footer-placeholder"></footer>
        <script src="../footer.js"></script>
        <template id="rmailfeedcardtemplate">
            <li class='rmailpreview' data-id='1'>
                <div class='rmailauthorheader'>
                    <img class='authorpfp' src='https://avatars.rotur.dev/Sender' width=40 height=40 alt='Sender'>
                    <div class="rmail_fromandto">
                        <h2>User 1</h2>
                        <div class='rmailtorecipient'>
                            <p>To: </p>
                            <img class="recipientpfp" src='https://avatars.rotur.dev/Recipient' width=16 height=16 alt='Recipient'>
                            <p class="rmailto">User 2</p>
                        </div>
                    </div>
                </div>
                <div class='rmailpreviewbody'>
                    <h3>Title</h3>
                </div>
                <div class='rmailactionbuttons'>
                    <button class='rmailmarkread' title="Mark Rmail as Read" data-id='1'><img src='../images/misc_icons/visible.png' width=24 height=24></button>
                    <button class='rmailstar' title="Star Rmail" data-id='1'>★</button>
                    <button class='rmailarchive' title="Archive Rmail" data-id='1'><img src='../images/misc_icons/archive.png' width=24 height=24></button>
                    <button class='rmaildelete' title="Delete Rmail from feed" data-id='1'><img src='../images/misc_icons/delete.png' width=24 height=24></button>
                </div>
                <p class='rmailpreviewtimestamp'>Timestamp</p>
            </li>
        </template>
        <template id="rmailcardtemplate">
            <div class="rmail_author">
                <a class="author_href" href="lookup.html?user=Spectator">
                    <img class='viewrmailauthorpfp' src="https://avatars.rotur.dev/.banned_user" width="40" height="40" alt="placeholder">
                </a>
                <div class="rmail_fromandto">
                    <h3 class="viewrmailauthortext"><a class="author_href2" href="lookup.html?user=Spectator">Author</a></h3>
                    <div class="viewrmailrecipientinfo">
                        <p>To: </p>
                        <a class="recipient_href" href="lookup.html?user=Spectator">
                            <img class="viewrmailrecipientpfp" src='https://avatars.rotur.dev/.banned_user' width=16 height=16 alt='placeholder'>
                            <p class="viewrmailrecipient">Lorem Ipsum</p>
                        </a>
                    </div>
                </div>

            </div>
            <p class="viewrmailtimestamp">1/1/2026</p>
            <hr class="full-size dotted_separator">
            <div class="viewrmailtitle">
                <h2 class="viewrmailtitletext">Rmail Title</h2>
            </div>
            <div class="viewrmailbody">
                <p class="viewrmailbodytext">Lorem Ipsum</p>
                <div class="rmailimageplaceholder" style="display: none;"></div>
            </div>
            <div class="rmailreplyactionbar">
                <button class='rmailreply' title="Reply to Rmail" data-id='1' data-rmailtitle="place" data-rmailauthor="holder">&larrhk;</button>
                <button class='rmailedit2' title="Edit Rmail" data-id='1'><img src='../images/misc_icons/edit.png' width=24 height=24></button>
                <button class='rmailmarkread' title="Mark Rmail as Read" data-id='1'><img src='../images/misc_icons/visible.png' width=24 height=24></button>
                <button class='rmailreport' title="Reply to Rmail" data-id='1'><img src='../images/misc_icons/report.png' width=24 height=24></button>
                <button class='rmaildelete' title="Delete Rmail from feed" data-id='1'><img src='../images/misc_icons/delete.png' width=24 height=24></button>
            </div>
        </template>
        <template id="actionbartemplate">
            <button class='rmailreply' title="Reply to Rmail" id='viewrmailreply' data-id='1' data-rmailtitle="place" data-rmailauthor="holder">&larrhk;</button>
            <button class='rmailedit2' title="Edit Rmail" id='viewrmailedit2' data-id='1'><img src='../images/misc_icons/edit.png' width=24 height=24></button>
            <button class='rmailmarkread' title="Mark Rmail as Read" id="viewrmailmarkread" data-id='1'><img src='../images/misc_icons/visible.png' width=24 height=24></button>
            <button class='rmailstar' title="Star Rmail" id="viewrmailstar" data-id='1'>★</button>
            <button class='rmailthreads' title="Manage People" id="viewrmailthreads" data-id='1'><img src='../images/app_icons/credits.png' width=24 height=24></button>
            <button class='rmailarchive' title="Archive Rmail" id='viewrmailarchive' data-id='1'><img src='../images/misc_icons/archive.png' width=24 height=24></button>
            <button class='rmailreport' title="Report Rmail" id='viewrmailreport' data-id='1'><img src='../images/misc_icons/report.png' width=24 height=24></button>
            <button class='rmaildelete' title="Delete Rmail from feed" id='viewrmaildelete' data-id='1'><img src='../images/misc_icons/delete.png' width=24 height=24></button>
        </template>
        <template id="threaduserentry">
            <li>
                <a href="lookup.html?user=Spectator">
                    <div>
                        <img src="https://avatars.rotur.dev/Spectator" width="24" height="24">
                        <p>Spectator</p>
                    </div>
                    <button class="rmailthreadremoveuser" data-user="lightsquare" title="Remove User From Rmail Thread">✕</button>
                </a>
            </li>
        </template>
        <template id="replyactiontemplate">
            <li style="padding-bottom: 0;">
                <div class="rmailreplyactionlabel">
                    <h3>Dominic added Dav to the thread.</h3>
                    <button class='rmaildelete' title="Delete Rmail from feed" data-id='1'><img src='../images/misc_icons/delete.png' width=24 height=24></button>
                </div>
                <p class="viewrmailtimestamp" style="margin-top: 0; margin-bottom: -5px;">1/1/2026</p>
            </li>
        </template>
    </body>
</html>
